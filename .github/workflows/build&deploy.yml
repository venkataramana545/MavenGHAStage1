name: Build and deploy
on:
    workflow_dispatch
permissions: 
    id-token: write
    contents: read
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v3
            - name: setup java 21
              uses: actions/setup-java@v4
              with:
                    distribution: temurin
                    java-version: 21
                    cache: maven
            - name: java and maven version
              run: |
                    java -version
                    mvn -version
            - name: compile and package
              run: mvn clean package
            - name: verify jar file
              run: |
                ls -l target/*.jar
                echo "JAR file verification completed."
            - name: prepare EBS package
              run: |
                mkdir -p eb-deployment
                cp target/*.jar eb-deployment/
                echo "web: java -jar *.jar" > eb-deployment/Procfile
                ls -la eb-deployment
            - name: upload artifacts
              uses: actions/upload-artifact@v4
              with:
                    name: streamflix-deployment
                    path: eb-deployment              