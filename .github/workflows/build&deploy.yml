name: Build and deploy
on:
    workflow_dispatch
permissions: 
    id-token: write
    contents: read
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v3
            - name: setup java 21
              uses: actions/setup-java@v4
              with:
                    distribution: temurin
                    java-version: 21
                    cache: maven
            - name: java and maven version
              run: |
                    java -version
                    mvn -version
            - name: compile and package
              run: mvn clean package
            - name: verify jar file
              run: |
                ls -l target/*.jar
                echo "JAR file verification completed."
            - name: prepare EBS package
              run: |
                mkdir -p eb-deployment
                cp target/*.jar eb-deployment/
                echo "web: java -jar *.jar" > eb-deployment/Procfile
                ls -la eb-deployment
            - name: upload artifacts
              uses: actions/upload-artifact@v4
              with:
                    name: streamflix-deployment
                    path: eb-deployment 
    terraform:
      name: terraform infra
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: checkout code
          uses: actions/checkout@v3
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                aws-region: ap-south-2
                role-session-name: githublink
        - name: verify AWS credentials
          run: |
                aws sts get-caller-identity
        - name: setup terraform
          uses: hashicorp/setup-terraform@v3
        - name: terraform init
          working-directory: terraform
          run: terraform init
        - name: terraform plan
          working-directory: terraform
          run: terraform plan
        # - name: terraform apply
        #   working-directory: terraform
        #   run: terraform apply -auto-approve
        - name: terraform destroy
          working-directory: terraform
          run: terraform destroy -auto-approve
        
    deploy:
      name: deploy to EBS
      runs-on: ubuntu-latest
      needs: terraform
      steps:
        - name: download artifacts
          uses: actions/download-artifact@v4
          with:
                name: streamflix-deployment
                path: deployment
        - name: verify deployment files
          run: |
                echo "Verifying deployment files..."
                ls -la deployment
                echo "verify proc file content"
                cat deployment/Procfile
                test -f deployment/Procfile && echo "Procfile exists."
                test -f deployment/*.jar && echo "JAR file exists."
        - name: create zip file for EBS deployment
          run: |
                cd deployment
                zip -r ../streamflix-deployment.zip .
                cd ..
                unzip -l streamflix-deployment.zip
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                aws-region: ap-south-2
                role-session-name: githublink
        - name: verify AWS credentials
          run: |
                aws sts get-caller-identity
        - name: deploy to EBS
          uses: aws-actions/elastic-beanstalk-deploy@v1
          with:
                application-name: streamflix545
                environment-name: streamflix545-dev
                version-label: streamflix-${{ github.run_number }}
                region: ap-south-2
                deployment-package-path: streamflix-deployment.zip

          